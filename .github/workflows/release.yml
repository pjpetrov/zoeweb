name: build

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-fund --no-audit

      - run: node build/build.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoeweb-single-file
          path: dist/zoeweb.html

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zoeweb.html
          generate_release_notes: true
          body: |
            **ZoeWeb — single-file build.** Download `zoeweb.html`, open it in
            Chrome or Edge, and the app runs — demo mode works instantly, and a
            real car connects via a USB or Bluetooth-LE ELM327 dongle.
